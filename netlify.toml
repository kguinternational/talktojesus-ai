[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.10"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/sms"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/voice"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/create_zoom_meeting"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/create_google_meet"
  to = "/.netlify/functions/index"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
